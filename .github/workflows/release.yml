name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/SelfRefreshSetup/signer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish portable executable
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "0.0.0"
          if ($tag -match '^v(\d+\.\d+\.\d+)$') { $version = $Matches[1] }
          ./tools/SelfRefreshSetup/publish.ps1 -Version $version

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "tools/SelfRefreshSetup/dist/SelfRefreshKit.exe" `
            --title "${{ github.ref_name }}" `
            --notes "SelfRefreshKit Windows first-install tool. One portable exe. It needs the .NET 10 Desktop Runtime. It does not need a separate Rust or Python install. iTunes or Apple Devices, plus a cable, are still required."
